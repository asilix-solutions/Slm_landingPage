name: CI

# Validation only (no deployment). Runs on pull requests that target main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # package.json "engines": node >=20.9.0 (Next.js 16). 22 is an active LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` runs first (package.json), so this works on a clean checkout.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
